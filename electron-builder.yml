appId: com.tda.car-rental
productName: TDA Car Rental
icon: src/electron/static/logo.png
npmRebuild: false
directories:
  output: release
files:
  - dist-electron/**
  - package.json
extraResources:
  - from: .output
    to: app-server
  - from: src/electron/static
    to: electron-static
asarUnpack:
  - node_modules/classic-level/**
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  packElevateHelper: false
  deleteAppDataOnUninstall: false
